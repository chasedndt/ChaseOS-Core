[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chaseos-core"
version = "0.1.0"
description = "ChaseOS Core — privacy-first, local-first agentic OS framework (MIT)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
keywords = [
    "agents",
    "local-first",
    "governance",
    "approval-gated",
    "automation",
    "framework",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core is near-stdlib: the only required runtime dependency is a YAML parser
# (workflow manifests, role cards, task-type table, schedules, context boot are YAML).
# All other capabilities live behind extras.
dependencies = [
    "PyYAML>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/chasedndt/ChaseOS-Core"
Repository = "https://github.com/chasedndt/ChaseOS-Core"
Issues = "https://github.com/chasedndt/ChaseOS-Core/issues"
Changelog = "https://github.com/chasedndt/ChaseOS-Core/blob/main/CHANGELOG.md"
Documentation = "https://github.com/chasedndt/ChaseOS-Core/blob/main/docs/ARCHITECTURE.md"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
]
browser = [
    # Bounded browser/operator surface (runtime/operator_surface/*). Runs in STUB mode
    # without this; install to enable live browser operation. After: playwright install chromium
    "playwright>=1.40",
]
voice = [
    # OpenCore on-device voice lane (no API key). STT: faster-whisper. TTS: Piper.
    "faster-whisper>=1.2.0",
    "piper-tts>=1.4.0",
    "sounddevice>=0.5.0",
    "numpy>=2.0",
]

# The Core operator CLI is the lean Core entrypoint (NOT the proprietary operator
# god-module). The full `runtime.cli.main` is not part of MIT Core.
[project.scripts]
chaseos = "runtime.cli.core_main:main"
chase = "runtime.cli.core_main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["runtime*"]

# Core ships behaviour as data: provider manifests, the AOR task-type table, the decision
# contract schema, gateway allowlists, and the commerce catalogue. Without these the wheel
# installs but degrades silently (e.g. `connections providers` returns an empty list), so
# they must be declared as package data — a wheel-install smoke test guards this in CI.
[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: long-running tests; deselected by default (run with -m slow)",
]

# ── Notes ──────────────────────────────────────────────────────────────────────
# Setup:   pip install -e .   then   chaseos doctor
# `chaseos` is the lean Core CLI (runtime/cli/core_main.py). Optional extras:
#   pip install -e .[browser]   # live browser operation (then: playwright install chromium)
#   pip install -e .[voice]     # on-device STT/TTS
