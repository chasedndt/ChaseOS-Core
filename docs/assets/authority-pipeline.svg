<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" width="1080" height="420" role="img" aria-labelledby="apTitle apDesc">
  <title id="apTitle">ChaseOS Core authority pipeline</title>
  <desc id="apDesc">A request flows through modality routing, the approval gateway port, and bounded execution. Without a bound gateway the path denies by default; canonical writes require an explicit promotion gate.</desc>

  <defs>
    <linearGradient id="apBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#111a2c"/>
    </linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#39e6d2"/>
    </marker>
    <marker id="arwDeny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff5f6d"/>
    </marker>
    <style>
      .lbl  { font-family: "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-size: 15px; fill: #e6edf7; font-weight: 600; }
      .sub  { font-family: "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #92a4bd; }
      .edge { font-family: "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #7f92ad; }
      .box  { fill: #16203a; stroke: #39e6d2; stroke-opacity: .55; }
      .boxV { fill: #191a3a; stroke: #7c5cff; stroke-opacity: .6; }
    </style>
  </defs>

  <rect width="1080" height="420" fill="url(#apBg)" rx="14"/>
  <text x="34" y="44" class="lbl" font-size="20">Authority pipeline</text>
  <text x="34" y="66" class="sub">Every material step is routed, gated, and evidenced — writes are never implicit.</text>

  <!-- 1. Request -->
  <rect x="34" y="110" width="176" height="74" rx="11" class="box"/>
  <text x="122" y="141" class="lbl" text-anchor="middle">Request</text>
  <text x="122" y="162" class="sub" text-anchor="middle">CLI / workflow / agent</text>

  <!-- 2. Modality router -->
  <rect x="266" y="98" width="200" height="98" rx="11" class="boxV"/>
  <text x="366" y="128" class="lbl" text-anchor="middle">Modality router</text>
  <text x="366" y="149" class="sub" text-anchor="middle">human · rules · ML · genAI</text>
  <text x="366" y="167" class="sub" text-anchor="middle">chooses WHO acts,</text>
  <text x="366" y="182" class="sub" text-anchor="middle">before choosing a provider</text>

  <!-- 3. Approval gateway -->
  <rect x="522" y="98" width="196" height="98" rx="11" class="boxV"/>
  <text x="620" y="128" class="lbl" text-anchor="middle">ApprovalGateway</text>
  <text x="620" y="149" class="sub" text-anchor="middle">port — ADR-0014</text>
  <text x="620" y="167" class="sub" text-anchor="middle">accountable human,</text>
  <text x="620" y="182" class="sub" text-anchor="middle">scope, evidence, timeout</text>

  <!-- 4. Bounded execution -->
  <rect x="774" y="110" width="176" height="74" rx="11" class="box"/>
  <text x="862" y="141" class="lbl" text-anchor="middle">Bounded execution</text>
  <text x="862" y="162" class="sub" text-anchor="middle">within write scope</text>

  <!-- animated flow (SMIL: survives GitHub's SVG sanitizer) -->
  <g stroke="#39e6d2" stroke-width="2.2" fill="none" stroke-dasharray="7 6" marker-end="url(#arw)">
    <path d="M210 147 H262">
      <animate attributeName="stroke-dashoffset" from="0" to="-13" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <path d="M466 147 H518">
      <animate attributeName="stroke-dashoffset" from="0" to="-13" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <path d="M718 147 H770">
      <animate attributeName="stroke-dashoffset" from="0" to="-13" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <path d="M862 184 V296">
      <animate attributeName="stroke-dashoffset" from="0" to="-13" dur="1.1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- deny path: drops from the gateway straight into the DENY box -->
  <path d="M620 196 V224" stroke="#ff5f6d" stroke-width="2.2" fill="none"
        marker-end="url(#arwDeny)" stroke-dasharray="6 5"/>
  <rect x="392" y="230" width="238" height="44" rx="9" fill="#2a1420" stroke="#ff5f6d" stroke-opacity=".6"/>
  <text x="511" y="248" class="lbl" text-anchor="middle" font-size="13.5" fill="#ff8a94">DENY — no gateway bound</text>
  <text x="511" y="265" class="sub" text-anchor="middle" fill="#c88b93">Core default is fail-closed, not fail-open</text>

  <!-- evidence + promotion -->
  <rect x="774" y="300" width="176" height="70" rx="11" class="box"/>
  <text x="862" y="329" class="lbl" text-anchor="middle">Evidence</text>
  <text x="862" y="350" class="sub" text-anchor="middle">logs · audits · records</text>

  <rect x="34" y="300" width="216" height="70" rx="11" class="box"/>
  <text x="142" y="329" class="lbl" text-anchor="middle">Canonical knowledge</text>
  <text x="142" y="350" class="sub" text-anchor="middle">promoted, never auto-written</text>

  <path d="M770 335 H256" stroke="#39e6d2" stroke-width="2.2" fill="none"
        marker-end="url(#arw)" stroke-dasharray="7 6" stroke-opacity=".85"/>
  <text x="512" y="326" class="edge" text-anchor="middle">explicit review / promotion gate</text>
</svg>
