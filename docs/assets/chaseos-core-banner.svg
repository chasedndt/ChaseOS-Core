<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">ChaseOS Core</title>
  <desc id="bannerDesc">ChaseOS Core banner: the C-kernel mark with Runtime Teal arc and Knowledge Violet agent nodes, alongside the project name and tagline.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="60%" stop-color="#0d1220"/>
      <stop offset="100%" stop-color="#121a2e"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39e6d2"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39e6d2" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#39e6d2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <circle cx="185" cy="150" r="130" fill="url(#glow)"/>

  <!-- Brand mark (official geometry, scaled) -->
  <g transform="translate(105,70) scale(2.5)">
    <path d="M48.3 15.7A23 23 0 1 0 48.3 48.3" fill="none" stroke="#39e6d2"
          stroke-width="6.4" stroke-linecap="round"/>
    <path d="M32 32 48.3 15.7M32 32l16.3 16.6" fill="none" stroke="#7c5cff"
          stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="48.3" cy="15.7" r="5.5" fill="#7c5cff">
      <animate attributeName="opacity" values="1;0.45;1" dur="3s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="48.3" cy="48.3" r="5.5" fill="#7c5cff">
      <animate attributeName="opacity" values="1;0.45;1" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="32" cy="32" r="7" fill="#39e6d2">
      <animate attributeName="r" values="7;7.8;7" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="360" y="132" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="62" font-weight="700" fill="url(#wordGrad)">ChaseOS Core</text>
  <text x="363" y="178" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="23" fill="#9fb0c9">Governed, local-first framework for hybrid-intelligence systems</text>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17">
    <rect x="363" y="203" width="126" height="32" rx="16" fill="#39e6d2" fill-opacity="0.12" stroke="#39e6d2" stroke-opacity="0.45"/>
    <text x="426" y="224" fill="#39e6d2" text-anchor="middle">MIT licensed</text>
    <rect x="501" y="203" width="150" height="32" rx="16" fill="#7c5cff" fill-opacity="0.12" stroke="#7c5cff" stroke-opacity="0.45"/>
    <text x="576" y="224" fill="#9b83ff" text-anchor="middle">Approval-gated</text>
    <rect x="663" y="203" width="130" height="32" rx="16" fill="#39e6d2" fill-opacity="0.12" stroke="#39e6d2" stroke-opacity="0.45"/>
    <text x="728" y="224" fill="#39e6d2" text-anchor="middle">Fail-closed</text>
  </g>
</svg>
